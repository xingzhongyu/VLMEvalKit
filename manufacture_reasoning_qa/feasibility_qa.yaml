task: mfg_feasibility_qa
dataset_path: json
dataset_kwargs:
  data_files: 
    test: /mnt/nfs/zyxing/lm-evaluation-harness/lm_eval/tasks/manufacture_reasoning_qa/Reasoning QA/sample_jiaying_0321.jsonl
process_docs: !function utils.filter_feasibility_qa
output_type: generate_until
training_split: null
validation_split: null
test_split: test
doc_to_text: |
  Question: {{question}}
  Evidence:
  Products: {{evidence.products | join(', ')}}
  Material Capabilities: {{evidence.material_capabilities | join(', ')}}
  
  Please provide your answer and justification.
  Format your output exactly as follows:
  Answer: [Yes or No]
  Justification: [Your reasoning here]
doc_to_target: "{{answer.answer}}"
process_results: !function utils.process_feasibility_results
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: strict_acc
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "\n\n"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 128
task: mfg_capability_gap
dataset_path: json
dataset_kwargs:
  data_files:
    test: /mnt/nfs/zyxing/lm-evaluation-harness/lm_eval/tasks/manufacture_reasoning_qa/Reasoning QA/sample_jiaying_0321.jsonl
process_docs: !function utils.filter_capability_gap
output_type: generate_until
training_split: null
validation_split: null
test_split: test
doc_to_text: |
  Question: {{question}}
  Evidence:
  Industries: {{evidence.industries | join(', ')}}
  Certifications: {{evidence.certifications | join(', ')}}
  Choices:
  A. {{choices[0]}}
  B. {{choices[1]}}
  C. {{choices[2]}}
  D. {{choices[3]}}

  Please provide your answer and justification.
  Format your output exactly as follows:
  Answer: [The correct choice letter, e.g., A, B, C, or D]
  Justification: [Your reasoning here]
doc_to_target: !function utils.get_capability_gap_target
process_results: !function utils.process_capability_gap_results
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: strict_acc
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "\n\n"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 128

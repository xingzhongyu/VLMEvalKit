task: manufacture_qa_single
dataset_path: json
dataset_kwargs:
  data_files: /mnt/nfs/zyxing/lm-evaluation-harness/lm_eval/tasks/manufacture_qa/data/Sample_JuanWang_0322.json
output_type: multiple_choice
test_split: train
process_docs: !function utils.filter_single_choice

doc_to_text: |
  Please read the following company profiles and answer the question.
  {%- for choice in choices %}
  {{ choice }}
  {%- endfor %}

  Question: {{ question }}
  Answer:

doc_to_choice: !function utils.get_choice_labels
doc_to_target: !function utils.get_target_index

process_results: !function utils.process_results_single

metric_list:
  - metric: ndcg@5
    aggregation: mean
    higher_is_better: true
  - metric: ndcg@10
    aggregation: mean
    higher_is_better: true
  - metric: recall@1       # equivalent to Accuracy / Hit@1
    aggregation: mean
    higher_is_better: true
  - metric: recall@5
    aggregation: mean
    higher_is_better: true
  - metric: mrr            # Mean Reciprocal Rank
    aggregation: mean
    higher_is_better: true
